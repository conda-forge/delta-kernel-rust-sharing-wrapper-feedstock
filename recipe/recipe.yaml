# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.3.3"
  maturin_min: "1.0"
  maturin_max: "2.0"
  cargo_wrapper: cargo-auditable-wrapper${{ ".sh" if unix else ".bat" }}
  python_check_max: "3.14"

package:
  name: delta-kernel-rust-sharing-wrapper
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/d/delta-kernel-rust-sharing-wrapper/delta_kernel_rust_sharing_wrapper-${{ version }}.tar.gz
    sha256: 1ce82f9d18c66faaacca7f7a9a77b5210255a4d5bc6d61b8410f6bd5a9f37623
  - url: https://raw.githubusercontent.com/delta-io/delta-sharing/refs/heads/main/LICENSE.txt
    sha256: 5a2ae634be68464e407b80dbece9d8d822926c9b2cbdb1e801f5d27929589802

build:
  number: 1
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO: ${{ cargo_wrapper }}
      PYTHONIOENCODING: utf-8
      PYTHONLEGACYTEXTENCODING: utf-8
      OPENSSL_DIR: ${{ "$PREFIX" if unix else "%LIBRARY_PREFIX%" }}
    content:
      - if: win
        then:
          - set CARGO_HOME=c:\.cg
          - copy "%RECIPE_DIR%\${{ cargo_wrapper }}" "%BUILD_PREFIX%\Library\bin\"
        else:
          - cp "${RECIPE_DIR}/${{ cargo_wrapper }}" "${BUILD_PREFIX}/bin/"
          - chmod 755 "${BUILD_PREFIX}/bin/${{ cargo_wrapper }}"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - cargo-auditable
    - make
    - if: win
      then:
        - perl
  host:
    - maturin >=${{ maturin_min }},<${{ maturin_max }}
    - openssl
    - pip
    - python
    - if: is_abi3
      then:
        - python ${{ python_min }}.*
        - python-abi3
  run:
    - python
    - if: is_abi3
      then:
        - python >=${{ python_min }}
        - python-abi3

tests:
  - package_contents:
      strict: true
      site_packages:
        - delta_kernel_rust_sharing_wrapper/**
        - delta_kernel_rust_sharing_wrapper-${{ version }}.dist-info/**
  - python:
      imports: delta_kernel_rust_sharing_wrapper
      pip_check: true
      python_version:
        - if: is_abi3
          then:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
          else:
            - "*"
  - requirements:
      run:
        - if: is_abi3
          then:
            - abi3audit
            - python ${{ python_min }}.*
    script:
      - python -c "from importlib.metadata import version; assert version('delta-kernel-rust-sharing-wrapper') == '${{ version }}'"
      - if: is_abi3
        then:
          - if: unix
            then: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} ${SP_DIR}/delta_kernel_rust_sharing_wrapper/delta_kernel_rust_sharing_wrapper.abi3.so
            else: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} %SP_DIR%\delta_kernel_rust_sharing_wrapper\delta_kernel_rust_sharing_wrapper.pyd

about:
  homepage: https://pypi.org/project/delta-kernel-rust-sharing-wrapper
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: This adds a thin python bindings via maturin and pyo3 for delta-kernel-rust.
  repository: https://github.com/delta-io/delta-sharing/tree/main/python/delta-kernel-rust-sharing-wrapper

extra:
  recipe-maintainers:
    - bollwyvl
